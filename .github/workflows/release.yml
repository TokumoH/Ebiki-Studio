name: Release

# Disparado por uma tag `v*` (ex.: v0.1.0). Gera os instaladores dos 3 sistemas, publica a
# release com as notas do CHANGELOG.md e anexa SHA256SUMS.txt para verificação dos downloads.
# Também pode ser iniciado manualmente (aba Actions → Release → Run workflow): nesse caso a
# action cria a tag informada no commit escolhido.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag da versão a criar (ex.: v0.1.0)"
        required: true
        default: "v0.1.0"

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

# padrão somente leitura; só os jobs que publicam escrevem
permissions:
  contents: read

jobs:
  bundle:
    name: Instaladores (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            args: ""
            rust_targets: ""
          - name: Windows
            os: windows-latest
            args: ""
            rust_targets: ""
          - name: macOS (Apple Silicon + Intel)
            os: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        # runners às vezes travam esperando o lock do apt: limite de tempo + espera explícita
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=180 update
          sudo apt-get -o DPkg::Lock::Timeout=180 install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci --prefix ui
      - name: Validar versão
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag inválida: $TAG"; exit 1; }
          conf=$(node -p "require('./crates/app-desktop/tauri.conf.json').version")
          [[ "v$conf" == "$TAG" ]] || { echo "tauri.conf.json tem $conf, mas a tag é $TAG"; exit 1; }
      - name: Notas da versão (seção do CHANGELOG.md)
        id: notes
        shell: bash
        run: |
          version="${TAG#v}"
          {
            echo "body<<__EBIKI_NOTES__"
            awk -v v="$version" '
              /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found=1; next } }
              found { print }
            ' CHANGELOG.md
            echo "__EBIKI_NOTES__"
          } >> "$GITHUB_OUTPUT"
      - name: Assinatura das atualizações
        id: signing
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          # com a chave: gera pacotes de atualização assinados + latest.json (ADR-0034);
          # sem ela: a release sai normalmente, só sem atualização dentro do app
          if [[ "$HAS_KEY" == "true" ]]; then echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Segredo TAURI_SIGNING_PRIVATE_KEY ausente: release sem pacotes de atualização."
            echo "args=--config crates/app-desktop/tauri.unsigned-updates.conf.json" >> "$GITHUB_OUTPUT"
          fi
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # roda da raiz (como `npm run build` local): o beforeBuildCommand `npm --prefix ui …`
          # resolve a partir daqui e o CLI encontra crates/app-desktop/tauri.conf.json sozinho
          projectPath: .
          tauriScript: npm run tauri
          tagName: ${{ env.TAG }}
          releaseName: "Ebiki Studio ${{ env.TAG }}"
          releaseCommitish: ${{ github.sha }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          # latest.json aponta o Windows para o instalador NSIS (installMode passivo)
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} ${{ steps.signing.outputs.args }}

  checksums:
    name: Somas SHA-256
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Gerar e anexar SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mkdir dist && cd dist
          gh release download "$TAG" --repo "$REPO" --pattern '*' --skip-existing
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$REPO" --clobber
