name: Release

# Disparado por uma tag `v*` (ex.: v0.1.0) ou manualmente (aba Actions → Release → Run workflow).
# Fluxo (sem corrida entre os sistemas — a v0.4.0 saiu duplicada quando cada job criava a release):
#   1. preparar: valida a versão e cria a release como RASCUNHO, uma vez só;
#   2. instaladores (3 sistemas em paralelo): só enviam arquivos para esse rascunho;
#   3. publicar: monta o latest.json com todas as plataformas, gera SHA256SUMS.txt e publica.
# Se algum sistema falhar, nada é publicado (o rascunho fica para conferência).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag da versão a criar (ex.: v0.1.0)"
        required: true
        default: "v0.1.0"
      replace_existing:
        description: "Apagar releases já existentes desta tag antes de publicar (conserto de release quebrada)"
        type: boolean
        default: false

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

# padrão somente leitura; só os jobs que publicam escrevem
permissions:
  contents: read

jobs:
  prepare:
    name: Preparar release (rascunho)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - name: Validar versão
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag inválida: $TAG"; exit 1; }
          conf=$(node -p "require('./crates/app-desktop/tauri.conf.json').version")
          [[ "v$conf" == "$TAG" ]] || { echo "tauri.conf.json tem $conf, mas a tag é $TAG"; exit 1; }
      - name: Notas da versão (seção do CHANGELOG.md)
        run: |
          awk -v v="${TAG#v}" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md sem a seção [${TAG#v}]"; exit 1; }
      - name: Criar rascunho
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REPLACE: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_existing || false }}
        run: |
          existing=$(gh api "repos/$REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          if [[ -n "$existing" ]]; then
            if [[ "$REPLACE" != "true" ]]; then
              echo "::error::Já existe release $TAG (ids: $existing). Rode de novo com 'replace_existing' para substituí-la."
              exit 1
            fi
            for id in $existing; do gh api -X DELETE "repos/$REPO/releases/$id"; echo "release $id apagada"; done
          fi
          # tag que sobrou de uma release apagada: sai junto (a nova nasce no commit deste build)
          if [[ "$REPLACE" == "true" ]] && gh api "repos/$REPO/git/refs/tags/$TAG" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG"; echo "tag $TAG apagada"
          fi
          id=$(gh api "repos/$REPO/releases" -X POST \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="Ebiki Studio $TAG" \
            -F body=@notes.md -F draft=true -F prerelease=false --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "rascunho $id criado para $TAG"

  bundle:
    name: Instaladores (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            args: ""
            rust_targets: ""
          - name: Windows
            os: windows-latest
            args: ""
            rust_targets: ""
          - name: macOS (Apple Silicon + Intel)
            os: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        # runners às vezes travam esperando o lock do apt: limite de tempo + espera explícita
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=180 update
          sudo apt-get -o DPkg::Lock::Timeout=180 install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci --prefix ui
      - name: Assinatura das atualizações
        id: signing
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          # com a chave: gera pacotes de atualização assinados + latest.json (ADR-0034);
          # sem ela: a release sai normalmente, só sem atualização dentro do app
          if [[ "$HAS_KEY" == "true" ]]; then echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Segredo TAURI_SIGNING_PRIVATE_KEY ausente: release sem pacotes de atualização."
            echo "args=--config crates/app-desktop/tauri.unsigned-updates.conf.json" >> "$GITHUB_OUTPUT"
          fi
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # roda da raiz (como `npm run build` local): o beforeBuildCommand `npm --prefix ui …`
          # resolve a partir daqui e o CLI encontra crates/app-desktop/tauri.conf.json sozinho
          projectPath: .
          tauriScript: npm run tauri
          # só envia para o rascunho criado em "preparar"; o latest.json é montado uma vez, no fim
          releaseId: ${{ needs.prepare.outputs.release_id }}
          uploadUpdaterJson: false
          args: ${{ matrix.args }} ${{ steps.signing.outputs.args }}

  publish:
    name: Publicar (latest.json, SHA-256)
    needs: [prepare, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
      # rascunho ainda não tem tag: tudo pela API, pelo id (gh release download/upload procuram pela tag)
      - name: Baixar os arquivos do rascunho
        run: |
          gh api "repos/$REPO/releases/$RELEASE_ID" > release.json
          mkdir dist
          jq -r '.assets[] | "\(.id)\t\(.name)"' release.json | while IFS=$'\t' read -r id name; do
            gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$id" > "dist/$name"
          done
          ls -la dist
      - name: Tirar latest.json/SHA256SUMS.txt antigos do rascunho (os nossos são a fonte)
        run: |
          jq -r '.assets[] | select(.name == "latest.json" or .name == "SHA256SUMS.txt") | .id' release.json |
            while read -r id; do gh api -X DELETE "repos/$REPO/releases/assets/$id"; echo "asset $id apagado"; done
          rm -f dist/latest.json dist/SHA256SUMS.txt
      - name: latest.json (todas as plataformas ou nada)
        run: |
          if ls dist/*.sig >/dev/null 2>&1; then
            python3 scripts/release_latest_json.py release.json dist "$TAG" --out dist/latest.json
            gh api -X POST -H "Content-Type: application/json" --input dist/latest.json \
              "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=latest.json" --jq .name
          else
            echo "::warning::Sem .sig (segredo de assinatura ausente): release sem atualização no app."
          fi
      - name: SHA256SUMS.txt
        run: |
          cd dist
          sha256sum * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
          gh api -X POST -H "Content-Type: text/plain" --input ../SHA256SUMS.txt \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=SHA256SUMS.txt" --jq .name
      - name: Publicar a release
        run: gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" -F draft=false -f make_latest=true --jq '.html_url'
