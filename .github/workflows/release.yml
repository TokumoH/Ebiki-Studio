name: Release

# Disparado por uma tag `v*` (ex.: v0.1.0). Gera os instaladores dos 3 sistemas, publica a
# release com as notas do CHANGELOG.md e anexa SHA256SUMS.txt para verificação dos downloads.
on:
  push:
    tags: ["v*"]

# padrão somente leitura; só os jobs que publicam escrevem
permissions:
  contents: read

jobs:
  bundle:
    name: Instaladores (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            args: ""
            rust_targets: ""
          - name: Windows
            os: windows-latest
            args: ""
            rust_targets: ""
          - name: macOS (Apple Silicon + Intel)
            os: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci --prefix ui
      - name: Notas da versão (seção do CHANGELOG.md)
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "body<<__EBIKI_NOTES__"
            awk -v v="$version" '
              /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found=1; next } }
              found { print }
            ' CHANGELOG.md
            echo "__EBIKI_NOTES__"
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/app-desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Ebiki Studio ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  checksums:
    name: Somas SHA-256
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Gerar e anexar SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist && cd dist
          gh release download "$TAG" --repo "$REPO" --pattern '*' --skip-existing
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$REPO" --clobber
