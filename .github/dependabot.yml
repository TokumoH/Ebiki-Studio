version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: branchTrabalho
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ui
    target-branch: branchTrabalho
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ui-minor-patch:
        update-types: [minor, patch]
    ignore:
      # os tipos do Node acompanham o runtime usado (Node 22 LTS); major só junto com o runtime
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: branchTrabalho
    schedule:
      interval: monthly
    ignore:
      # a "versão" desta action é a versão do Rust; ela é fixada de propósito junto com o
      # rust-toolchain.toml e só muda numa atualização deliberada do toolchain
      - dependency-name: dtolnay/rust-toolchain
