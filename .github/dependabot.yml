version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: branchTrabalho
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ui
    target-branch: branchTrabalho
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ui-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: branchTrabalho
    schedule:
      interval: monthly
