[package]
name = "infra-codecs"
description = "Pure Fabrication de codecs: probe/decodificação, conversão de taxa, importação para o projeto, picos de waveform e exportação (WAV, AIFF, FLAC, MP3, OGG)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
shared-kernel.workspace = true
serde.workspace = true
thiserror.workspace = true
symphonia = { version = "0.6", default-features = false, features = ["all-codecs", "all-formats", "all-meta", "opt-simd"] }
rubato = { version = "5", default-features = false }
hound = "3.5"
flacenc = { version = "0.5", default-features = false }
mp3lame-encoder = { version = "0.3", optional = true }
vorbis_rs = { version = "0.5", optional = true, default-features = false }
sha2 = "0.11"
tempfile = "3"

[features]
default = ["mp3", "vorbis"]
# Codificador MP3 (LAME 3.100/4.0 compilado do fonte com `cc`; LGPL — ver ADR-0022).
mp3 = ["dep:mp3lame-encoder"]
# Codificador Ogg Vorbis (libvorbis aoTuV + libogg compilados com `cc`; BSD-3).
vorbis = ["dep:vorbis_rs"]

[dev-dependencies]
proptest.workspace = true
