[package]
name = "dsp"
description = "Pure Fabrication de processamento de áudio em tempo real: filtros, dinâmica, efeitos, medidores e metrônomo. Sem lógica de domínio e sem I/O."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
shared-kernel.workspace = true

[dev-dependencies]
proptest.workspace = true
assert_no_alloc = { version = "1.1", default-features = false, features = ["warn_debug", "warn_release"] }
