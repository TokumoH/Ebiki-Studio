[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.2.0"
license = "GPL-3.0-or-later"
rust-version = "1.97"

[workspace.dependencies]
shared-kernel = { path = "crates/shared-kernel" }
ctx-project = { path = "crates/ctx-project" }
ctx-mixing = { path = "crates/ctx-mixing" }
ctx-recording = { path = "crates/ctx-recording" }
app-core = { path = "crates/app-core" }
infra-persistence = { path = "crates/infra-persistence" }
audio-engine = { path = "crates/audio-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
proptest = "1"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
