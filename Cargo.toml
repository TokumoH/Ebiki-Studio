[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
rust-version = "1.87"

[workspace.dependencies]
shared-kernel = { path = "crates/shared-kernel" }
ctx-project = { path = "crates/ctx-project" }
ctx-mixing = { path = "crates/ctx-mixing" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
proptest = "1"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
